services:
  - type: web
    name: online-money-transfer-rates-1
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run render:build
    preDeployCommand: npm run db:migrate:render
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: omt-rates-db
          property: connectionString
      - key: INGEST_TOKEN
        sync: false
      - key: MANUAL_INGEST_TOKEN
        sync: false
      - key: AFFILIATE_REPORT_TOKEN
        sync: false

databases:
  - name: omt-rates-db
    databaseName: omt_rates
    user: omt_rates_app
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []

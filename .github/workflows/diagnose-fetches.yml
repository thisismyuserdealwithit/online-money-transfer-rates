name: Diagnose public rate fetches

on:
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - ".github/workflows/diagnose-fetches.yml"

concurrency:
  group: diagnose-public-rate-fetches
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crawler/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run crawl
        env:
          DRY_RUN: "1"
          PROVIDER_FILTER: xe,atlanticmoney,instarem,ria,taptapsend,transfergo,singx,starling,natwestbusiness,lloydsbusiness,santanderuk,wisecomparison
          SUMMARY_ONLY: "1"
